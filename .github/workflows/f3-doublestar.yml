name: REL f3-doublestar
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: ['**']
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Marker
        run: echo "REL f3-doublestar FIRED head_branch=${{ github.event.workflow_run.head_branch }} event=${{ github.event.workflow_run.event }}"
