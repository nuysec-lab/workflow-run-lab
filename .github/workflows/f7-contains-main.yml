name: REL f7-contains-main
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: ['*main*']
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Marker
        run: echo "REL f7-contains-main FIRED head_branch=${{ github.event.workflow_run.head_branch }} event=${{ github.event.workflow_run.event }}"
